[package]
name = "unblocker-core"
version = "0.2.0"
edition = "2021"
description = "Universal DPI + IP-block bypass engine — desync, DoH/hosts, auto-tune, health"

[lib]
name = "unblocker_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
hickory-resolver = { version = "0.24", features = ["dns-over-https-rustls", "tokio"] }
rand.workspace = true
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
notify = "8"
dirs = "6"
atty = "0.2"
ipnet = "2"
url = "2"
libc = "0.2"
# Telegram MTProto WebSocket bridge (native Rust replacement for tg-ws-proxy.py)
aes.workspace = true
ctr.workspace = true
sha2.workspace = true
hmac.workspace = true
tokio-rustls.workspace = true
cipher.workspace = true
futures-util.workspace = true
hex.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
base64.workspace = true
byteorder.workspace = true
socket2.workspace = true
tokio-util.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true

[build-dependencies]
cc = "1"
